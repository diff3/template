{% extends "base.html" %}
{% block title %}{% if realm %}Edit Realm{% else %}Create Realm{% endif %}{% endblock %}
{% block content %}
<section class="card">
    <h1>{% if realm %}Edit Realm #{{ realm.id }}{% else %}Create Realm{% endif %}</h1>
    <form method="post" class="form-grid">
        {% if realm %}
        <label>
            ID
            <input type="number" value="{{ realm.id }}" readonly>
        </label>
        {% endif %}
        <label>
            Name
            <input type="text" name="name" value="{{ realm.name if realm else '' }}" required>
        </label>
        <label>
            Type
            <select name="icon" required>
                {% for value, label in realm_types.items() %}
                <option value="{{ value }}" {% if (realm and realm.icon == value) or (not realm and value == 1) %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="form-actions">
            <button type="submit">Save</button>
            <a class="button-link secondary" href="{{ url_for('realmlist') }}">Back</a>
        </div>
    </form>
</section>
{% endblock %}
